name: Production channel

# Points the server-config production channel to the commit of a published release.
# Triggered by releases created by hand (after the e2e tests), and called by the Tag workflow for the releases it creates.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  # The Tag workflow runs the e2e tests before calling this one; a release published by hand has not.
  e2e:
    if: github.event_name == 'release'
    uses: ./.github/workflows/e2e.yml

  update-production:
    needs: e2e
    if: ${{ !cancelled() && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Update production.json
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: .github/scripts/update-channel.sh production "$(git rev-parse HEAD)" "[DRPG] Version $TAG"
