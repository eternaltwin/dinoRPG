name: E2E

# Playwright e2e tests on the real stack (see e2e/). They gate what reaches production:
# called by the Tag workflow before staging is merged into develop, and by the Production
# channel workflow for releases published by hand. Also run on pull requests to develop.
on:
  pull_request:
    branches: [develop]
  workflow_call:
  workflow_dispatch:

jobs:
  front-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dinorpg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dinorpg_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn build:core
      - run: yarn build:render
      - run: yarn build:back
      - id: playwright
        working-directory: e2e
        run: echo "version=$(yarn playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - working-directory: e2e
        run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
