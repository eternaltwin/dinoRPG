name: Update release channel

on:
  push:
    branches: [staging]
    tags: ['*']

jobs:
  update-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update eternaltwin/config channel file
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git fetch --no-tags origin staging develop
            if git merge-base --is-ancestor "$GITHUB_SHA" "origin/staging"; then
              TARGET_FILE="production.json"
              TARGET_CHANNEL="production"
              TARGET_COMMIT_MESSAGE="[DRPG] Version $GITHUB_REF_NAME"
            else
              echo "Tagged commit $GITHUB_SHA is not on staging, skipping release update."
              exit 0
            fi
          else
            TARGET_FILE="staging.json"
            TARGET_CHANNEL="staging"
            TARGET_COMMIT_MESSAGE="[DRPG] Staging $GITHUB_SHA"
          fi

          CONFIG_FILE_URL="https://gitlab.com/api/v4/projects/eternaltwin%2Fconfig/repository/files/pousty%2Fapps%2Fdinorpg%2Fchannels%2F${TARGET_FILE}"
          CURRENT_CONTENT=$(curl --silent --fail "${CONFIG_FILE_URL}?ref=main" | jq -r '.content' | base64 -d)
          NEW_CONTENT=$(echo "$CURRENT_CONTENT" | jq --arg hash "$GITHUB_SHA" '.release = $hash')
          echo "Updating ${TARGET_CHANNEL}.json with commit $GITHUB_SHA"
          echo "$NEW_CONTENT" | jq '.'

          curl --fail --request PUT \
            --header "PRIVATE-TOKEN: ${CONFIG_REPO_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{
              \"branch\": \"main\",
              \"content\": $(echo "$NEW_CONTENT" | jq -Rs .),
              \"commit_message\": \"$TARGET_COMMIT_MESSAGE\"
            }" \
            "$CONFIG_FILE_URL"
