name: Staging channel

# Every push on staging points the server-config staging channel to the new commit.
on:
  push:
    branches: [staging]

jobs:
  update-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update staging.json
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: .github/scripts/update-channel.sh staging "$GITHUB_SHA" "[DRPG] Staging $GITHUB_SHA"
