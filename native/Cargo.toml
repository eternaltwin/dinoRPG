[package]
name = "native-dinorpg"
version = "0.1.0"
license = "ISC"
edition = "2018"
exclude = ["index.node"]
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]
test = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.8.5"

[dependencies.neon]
version = "0.10"
default-features = false
features = ["napi-6"]

[build-dependencies]
neon-build = "0.10.0"