<div id="centerContent">

	<div v-if="nameChoosen === false">
		<choose-dinoz-name
			:dinozData="dinozData"
			@setNameChoosen="setNameChoosen"
		></choose-dinoz-name>
	</div>

	<div class="dinoz" v-if="nameChoosen === true">
		<a class="left"></a>
		<div class="title">{{ dinozData.name }}</div>
		<a class="right"></a>
		<div class="avatar">
			<dinozSWF
				:display="dinozData.display"
				:width="190"
				:height="165"
				type="dino"
			></dinozSWF>
		</div>
		<div class="level">
			<div class="over">{{ dinozData.level.level }}</div>
		</div>
		<div class="infos">
			<elements
				:fire="dinozData.nbrUpFire"
				:wood="dinozData.nbrUpWood"
				:water="dinozData.nbrUpWater"
				:light="dinozData.nbrUpLight"
				:air="dinozData.nbrUpAir"
			></elements>
		</div>
		<div class="bars">
			<div class="life">
				<div class="bar">
					<img src="@/assets/bar/bar_life.png" :style="getBarSize(dinozData.life, dinozData.maxLife)">
				</div>
			</div>
			<div class="lifetext">{{ dinozData.life }} / {{ dinozData.maxLife }}</div>
			<div class="xp">
				<div class="bar">
					<img src="@/assets/bar/bar_xp.png" :style="getBarSize(dinozData.experience, dinozData.level.experience)">
				</div>
			</div>
			<div class="xptext">{{ dinozData.experience }} / {{ dinozData.level.experience }}</div>
		</div>
		<div class="equip" id="equip">
			<ul>
				<li v-for="(objet, index) in dinozData.object" :key="index">
					<a href="#" class="icon">
						<img :src="getImg('object', objet.name)" :alt="objet.name">
					</a>
				</li>
			</ul>
		</div>
		<div class="fx">
			<img
				:src="getImg('status', status.name)"
				v-for="(status, index) in dinozData.status"
				:key="index"
			/>
		</div>
	</div>

	<div class="dinozPanels" v-if="nameChoosen === true">
		<div class="actions" id="dinozActions">
			<ul>
				<table class="action" v-for="action in dinozData.actions" :key="action.name" :id="action.imgName">
					<tbody>
						<tr>
							<td class="icon"><img :src="getImg('icons', action.imgName)"></td>
							<td class="label">{{ $t(`action.${action.name}`) }}</td>
						</tr>
					</tbody>
				</table>
			</ul>
		</div>

		<div class="custom" id="dinozPanel">
			<ul class="tabs">
				<li class="active">
					<a href="#">{{ $t('tabs.carte') }}</a>
				</li>
				<li>
					<a href="#">{{ $t('tabs.inventaire') }}</a>
				</li>
				<li>
					<a href="#">{{ $t('tabs.details') }}</a>
				</li>
			</ul>
		</div>

		<div class="clear"></div>
		<div class="footer"></div>
	</div>
</div>
