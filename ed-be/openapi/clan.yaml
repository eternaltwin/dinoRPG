openapi: 3.0.3
info:
  title: DinoRPG Clan API
  description: >
    Routes for clan management: creation, membership, pages, banner, messages,
    history, treasure and join requests. Reconstructed from
    ed-be/src/routes/clan.routes.ts and ed-be/src/business/clanService.ts.
  version: '1.0.0'
servers:
  - url: /
tags:
  - name: Clan
    description: Clan management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Authentication is checked inside the business layer (auth(req) reading
        the Authorization header), not via Express middleware. A missing or
        invalid token throws and is reported as a 500 response (see Error500).
  responses:
    ValidationError:
      description: express-validator rejected one or more path/query/body params
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                description: express-validator Result object
    ServerError:
      description: >
        Error while processing the request. Covers unexpected failures as well
        as expected domain errors (not authenticated, missing rights, entity
        not found, business rule violation, ...) - the handler always replies
        with HTTP 500 and the error message as plain text in both cases.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    ClanLite:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        treasureValue:
          type: integer
        creationDate:
          type: string
          format: date-time
        leaderId:
          type: string
        langs:
          type: array
          items:
            type: string
    ClanForSearch:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    ClanMember:
      type: object
      properties:
        id:
          type: integer
        dateJoin:
          type: string
          format: date-time
        nickname:
          type: string
          nullable: true
        rights:
          type: array
          items:
            type: string
        donation:
          type: integer
        player:
          type: object
        clan:
          type: object

paths:
  /api/v1/clan/all/{page}:
    get:
      tags: [Clan]
      summary: Get a page of all clans
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: page
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Page of clans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClanLite' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/ranking/{type}/{page}:
    get:
      tags: [Clan]
      summary: Get a page of the clan ranking (treasure, event or war)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [treasure, event, war] }
        - in: path
          name: page
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Page of ranked clans
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/search/{name}/{page}:
    get:
      tags: [Clan]
      summary: Search clans by name (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: path
          name: page
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Matching clans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClanLite' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/search/{name}:
    get:
      tags: [Clan]
      summary: Search clans by name (lightweight, min 3 chars, no pagination)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string, minLength: 3 }
      responses:
        '200':
          description: Matching clans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClanForSearch' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}:
    get:
      tags: [Clan]
      summary: Get a clan by id (full data if it is the caller's own clan, public data otherwise)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Clan data
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Clan]
      summary: Delete a clan (leader only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Id of the deleted clan
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/members:
    get:
      tags: [Clan]
      summary: Get the member list of a clan
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Clan members
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan:
    post:
      tags: [Clan]
      summary: Create a new clan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, languages]
              properties:
                name: { type: string }
                description: { type: string }
                languages:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Created clan
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/join:
    post:
      tags: [Clan]
      summary: Request to join a clan
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Created join request
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/requests:
    get:
      tags: [Clan]
      summary: Get the pending join requests of a clan
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: List of pending join requests
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/edit/banner:
    put:
      tags: [Clan]
      summary: Update a clan's banner image
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Confirmation
          content:
            application/json:
              schema: { type: string, example: clan }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/edit/langs:
    put:
      tags: [Clan]
      summary: Update a clan's languages
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [languages]
              properties:
                languages:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated list of languages
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/banner:
    get:
      tags: [Clan]
      summary: Get a clan's banner image (no authentication required)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Banner image bytes (may be empty if the clan has none)
          content:
            image/webp:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/request/{id}:
    delete:
      tags: [Clan]
      summary: Deny a join request
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Denied request
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Clan]
      summary: Accept a join request
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: New clan member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClanMember' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/request/self:
    get:
      tags: [Clan]
      summary: Get the caller's own pending join request, if any
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The player's pending join request
          content:
            application/json:
              schema: { type: object, nullable: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: No pending join request for this player
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{clanId}/member/{memberId}:
    get:
      tags: [Clan]
      summary: Get a clan member
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clanId
          required: true
          schema: { type: integer }
        - in: path
          name: memberId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Clan member
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{clanId}/member/{id}:
    delete:
      tags: [Clan]
      summary: Exclude a member from a clan
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clanId
          required: true
          schema: { type: integer }
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: Id of the member to exclude
      responses:
        '200':
          description: Excluded member
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{clanId}/member:
    put:
      tags: [Clan]
      summary: Update a clan member's rights and nickname
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clanId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clanMember]
              properties:
                clanMember:
                  type: object
                  properties:
                    id: { type: string }
                    rights:
                      type: array
                      items: { type: string }
                    nickname: { type: string, nullable: true }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/member/self:
    delete:
      tags: [Clan]
      summary: Leave the caller's own clan
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Result of leaving the clan
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{clanId}/pages:
    get:
      tags: [Clan]
      summary: Get the list of a clan's pages
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clanId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Clan pages
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/page/{id}:
    get:
      tags: [Clan]
      summary: Get a clan page by id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Clan page
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/page:
    post:
      tags: [Clan]
      summary: Create a new clan page
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content, isPublic, clanId]
              properties:
                name: { type: string }
                content: { type: string }
                isPublic: { type: boolean }
                clanId: { type: integer }
      responses:
        '200':
          description: Created page
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{clanId}/page/{pageId}:
    delete:
      tags: [Clan]
      summary: Delete a clan page
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clanId
          required: true
          schema: { type: integer }
        - in: path
          name: pageId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted page
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{clanId}/page/{id}:
    put:
      tags: [Clan]
      summary: Update a clan page
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clanId
          required: true
          schema: { type: integer }
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, isPublic, name]
              properties:
                content: { type: string }
                isPublic: { type: boolean }
                name: { type: string }
      responses:
        '200':
          description: Updated page
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/messages/{page}:
    get:
      tags: [Clan]
      summary: Get a page of a clan's messages
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: page
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Clan messages
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/history/{page}:
    get:
      tags: [Clan]
      summary: Get a page of a clan's history, with total count
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: page
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Clan history page and total count
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items: { type: object }
                  count: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{clanId}/hasRight/{right}:
    get:
      tags: [Clan]
      summary: Check whether the caller has a given right in a clan
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clanId
          required: true
          schema: { type: integer }
        - in: path
          name: right
          required: true
          schema: { type: string }
          description: Name of a ClanMemberRight enum value
      responses:
        '200':
          description: Whether the caller has the right
          content:
            application/json:
              schema: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/messagesCount:
    get:
      tags: [Clan]
      summary: Get the total count of a clan's messages
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Message count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/historyCount:
    get:
      tags: [Clan]
      summary: Get the total count of a clan's history entries
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: History entry count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/give:
    put:
      tags: [Clan]
      summary: Donate a set of ingredients to the clan treasure
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ingredients]
              properties:
                ingredients:
                  type: array
                  items:
                    type: object
                    properties:
                      itemId: { type: integer }
                      quantity: { type: integer }
      responses:
        '200':
          description: Empty response on success
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/clan/{id}/treasure:
    get:
      tags: [Clan]
      summary: Get the detailed treasure/ingredients of a clan
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Clan treasure details
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
