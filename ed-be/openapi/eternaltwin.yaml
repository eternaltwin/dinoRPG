openapi: 3.0.3
info:
  title: DinoRPG Eternaltwin API
  version: '1.0.0'
  description: Routes exposed by ed-be/src/routes/eternaltwin.routes.ts
paths:
  /api/v1/eternaltwin/{uuid}:
    get:
      summary: Check whether a player is eligible for leaderboard rewards
      description: >-
        Returns true only if the player exists, logged in today, has at least
        one dinoz, and none of their dinoz have remaining actions left.
      tags:
        - Eternaltwin
      parameters:
        - in: path
          name: uuid
          required: true
          description: Eternaltwin uuid of the player
          schema:
            type: string
      responses:
        '200':
          description: Eligibility result
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Invalid arguments (validation failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
        '500':
          description: >-
            Error (e.g. player not found, or an unexpected server/database
            error). Body is a plain-text error message.
          content:
            text/plain:
              schema:
                type: string
