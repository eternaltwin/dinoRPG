stages:
  - build
  - test
  - update_release

before_script:
  - "node --version"
  - "yarn --version"
  - yarn install

container-build:
  stage: build
  image: "demurgos/node:2024.2"
  cache:
    - key:
        files:
          - "yarn.lock"
      paths:
        - ".yarn/cache/"
  artifacts:
    paths:
      - node_modules/
  script:
    - yarn build:gitlab
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

front-lint:
  stage: test
  image: "demurgos/node:2024.2"
  needs: [container-build]
  script:
    - yarn lint:test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

update_staging_via_api:
  stage: update_release
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      CURRENT_CONTENT=$(curl --silent --header "PRIVATE-TOKEN: ${CONFIG_REPO_TOKEN}" \
        "https://gitlab.com/api/v4/projects/eternaltwin%2Fconfig/repository/files/pousty%2Fapps%2Fdinorpg%2Fchannels%2Fstaging.json?ref=main" \
        | jq -r '.content' | base64 -d)
    - |
      NEW_CONTENT=$(echo "$CURRENT_CONTENT" | jq --arg hash "$CI_COMMIT_SHA" \
         '.release = $hash')
    - echo "Updating staging.json with commit $CI_COMMIT_SHA"
    - echo "$NEW_CONTENT" | jq '.'
    - |
      curl --request PUT \
        --header "PRIVATE-TOKEN: ${CONFIG_REPO_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"branch\": \"main\",
          \"content\": $(echo "$NEW_CONTENT" | jq -Rs .),
          \"commit_message\": \"Update staging release to $CI_COMMIT_SHA [skip ci]\"
        }" \
        "https://gitlab.com/api/v4/projects/eternaltwin%2Fconfig/repository/files/pousty%2Fapps%2Fdinorpg%2Fchannels%2Fstaging.json"
  
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

