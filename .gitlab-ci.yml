stages:
  - build
  - test
  - update_release

before_script:
  - "node --version"
  - "yarn --version"
  - yarn install

container-build:
  stage: build
  image: "demurgos/node:2024.2"
  cache:
    - key:
        files:
          - "yarn.lock"
      paths:
        - ".yarn/cache/"
  artifacts:
    paths:
      - node_modules/
  script:
    - yarn build:gitlab
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

front-lint:
  stage: test
  image: "demurgos/node:2024.2"
  needs: [container-build]
  script:
    - yarn lint:test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

update_staging_via_api:
  stage: update_release
  image: alpine:latest
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache curl jq git
  script:
    - jq --version
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git fetch --no-tags origin staging develop
        if git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/staging"; then
          TARGET_FILE="production.json"
          TARGET_CHANNEL="production"
          TARGET_COMMIT_MESSAGE="[DRPG] Version $CI_COMMIT_TAG"
        else
          echo "Tagged commit $CI_COMMIT_SHA is not on staging, skipping release update."
          exit 0
        fi
      else
        TARGET_FILE="staging.json"
        TARGET_CHANNEL="staging"
        TARGET_COMMIT_MESSAGE="[DRPG] Staging $CI_COMMIT_SHA"
      fi
    - |
      CURRENT_CONTENT=$(curl --silent \
        "https://gitlab.com/api/v4/projects/eternaltwin%2Fconfig/repository/files/pousty%2Fapps%2Fdinorpg%2Fchannels%2F${TARGET_FILE}?ref=main" \
        | jq -r '.content' | base64 -d)
    - NEW_CONTENT=$(echo "$CURRENT_CONTENT" | jq --arg hash "$CI_COMMIT_SHA" '.release = $hash')
    - echo "Updating ${TARGET_CHANNEL}.json with commit $CI_COMMIT_SHA"
    - echo "$NEW_CONTENT" | jq '.'
    - |
      curl --request PUT \
        --header "PRIVATE-TOKEN: ${CONFIG_REPO_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"branch\": \"main\",
          \"content\": $(echo "$NEW_CONTENT" | jq -Rs .),
          \"commit_message\": \"$TARGET_COMMIT_MESSAGE\"
        }" \
        "https://gitlab.com/api/v4/projects/eternaltwin%2Fconfig/repository/files/pousty%2Fapps%2Fdinorpg%2Fchannels%2F${TARGET_FILE}"

  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: on_success

back-coverage:
  stage: test
  image: "demurgos/node:2024.2"
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  cache:
    paths:
      - "ed-be/coverage/"
      - junit.xml
  script:
    - yarn build:core
    - yarn build:render
    - cd ed-be
    - >-
      yarn vitest run --coverage
      --coverage.reporter=text
      --coverage.reporter=cobertura
      --reporter=default
      --reporter=junit
      --outputFile.junit=junit.xml
  dependencies:
    - container-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
  artifacts:
    when: always
    reports:
      junit:
        - ed-be/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: ed-be/coverage/cobertura-coverage.xml
