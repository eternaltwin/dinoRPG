stages:
  - build
  - test

before_script:
  - cp ed-be/config_development.toml.example ed-be/config_development.toml
  - "node --version"
  - "yarn --version"
  - "rustc --version"
  - "cargo --version"
  - yarn install

container-build:
  stage: build
  image: "demurgos/node:2023.6"
  variables:
    CARGO_HOME: ".cargo"
    RUSTFLAGS: "-C target-feature=-crt-static"
  cache:
    - key:
        files:
          - "yarn.lock"
      paths:
        - ".yarn/cache/"
  artifacts:
    paths:
      - node_modules/
  script:
    - yarn build:gitlab
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

front-lint:
  stage: test
  image: "demurgos/node:2023.6"
  needs: [container-build]
  script:
    - yarn lint:test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

