.node_front: &node_front
  image: node:15
  cache:
    paths:
      - node_modules/
  before_script:
    - cd ed-ui
    - yarn install

.node_back: &node_back
  image: node:15
  cache:
    paths:
      - node_modules/
  before_script:
    - cd ed-be
    - yarn install

front-lint:
  <<: *node_front
  script:
    - yarn lint --no-fix
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'